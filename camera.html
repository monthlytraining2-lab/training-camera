
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>กล้องถ่ายภาพยืนยันการเข้าฝึก</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 520px;
      margin: 20px auto;
      padding: 22px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 15px #00000012;
      text-align: center;
    }

    h2 {
      color: #1d4ed8;
      margin-top: 0;
    }

    .description {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
    }

    video, canvas {
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
      background: #0f172a;
      border-radius: 12px;
      margin-top: 12px;
    }

    .hidden {
      display: none !important;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .success {
      background: #16a34a;
      color: white;
    }

    .secondary {
      background: #e2e8f0;
      color: #1e293b;
    }

    #status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      text-align: left;
    }

    #status.error {
      background: #fee2e2;
      color: #b91c1c;
    }

    #status.success {
      background: #dcfce7;
      color: #166534;
    }

    #browserGuide {
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      background: #fff7ed;
      color: #9a3412;
      font-size: 14px;
      line-height: 1.7;
      text-align: left;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📷 ถ่ายภาพยืนยันการเข้าฝึก</h2>

  <p class="description">
    กรุณาเปิดกล้องและถ่ายภาพใบหน้าให้ชัดเจน
    เมื่อยืนยันภาพแล้ว ระบบจะส่งภาพกลับไปยังหน้าลงทะเบียน
  </p>

  <video id="video"
         autoplay
         playsinline
         muted
         class="hidden"></video>

  <canvas id="canvas" class="hidden"></canvas>

  <div id="status">
    กรุณากดปุ่มเปิดกล้องเพื่อเริ่มใช้งาน
  </div>

  <div id="browserGuide" class="hidden"></div>

  <button id="openBtn"
          class="primary"
          onclick="startCamera()">
    เปิดกล้อง
  </button>

  <button id="captureBtn"
          class="success hidden"
          onclick="capturePhoto()">
    ถ่ายภาพ
  </button>

  <button id="retakeBtn"
          class="secondary hidden"
          onclick="retakePhoto()">
    ถ่ายใหม่
  </button>

  <button id="confirmBtn"
          class="success hidden"
          onclick="confirmPhoto()">
    ยืนยันและส่งภาพกลับ
  </button>

  <button id="closeBtn"
          class="secondary"
          onclick="closeCameraPage()">
    ปิดหน้าต่าง
  </button>

</div>

<script>
  let cameraStream = null;
  let photoData = null;
  let cameraReady = false;

  // ตรวจสอบประเภทอุปกรณ์และเบราว์เซอร์
  const userAgent = navigator.userAgent || '';

  const isLineBrowser =
    /Line\/|LIFF/i.test(userAgent);

  const isAndroid =
    /Android/i.test(userAgent);

  const isIOS =
    /iPhone|iPad|iPod/i.test(userAgent) ||
    (
      navigator.platform === 'MacIntel' &&
      navigator.maxTouchPoints > 1
    );

  const isChrome =
    /Chrome|CriOS/i.test(userAgent) &&
    !/Edg|OPR/i.test(userAgent);

  const isSafari =
    /Safari/i.test(userAgent) &&
    !/Chrome|CriOS|Edg|OPR/i.test(userAgent);

  // รับรหัสชั่วคราวจากหน้า Training
  const params = new URLSearchParams(
    window.location.hash.substring(1)
  );

  const cameraNonce = params.get('nonce') || '';

  function setStatus(message, type) {
    const box = document.getElementById('status');

    box.textContent = message;
    box.className = type || '';
  }

  function showBrowserGuide() {
    const guide = document.getElementById('browserGuide');

    guide.classList.remove('hidden');

    let message = '';

    if (isAndroid) {
      message =
        '<b>วิธีใช้งานบน Android</b><br>' +
        '1. กลับไปยังหน้าระบบลงทะเบียนใน LINE<br>' +
        '2. กดเมนูจุดสามจุด หรือเมนูเพิ่มเติมของ LINE<br>' +
        '3. เลือกเปิดด้วยเบราว์เซอร์ภายนอก หรือ Open in Browser<br>' +
        '4. เลือก Google Chrome<br>' +
        '5. เข้าสู่ระบบใหม่และดำเนินการลงทะเบียนจนเสร็จใน Chrome';
    } else if (isIOS) {
      message =
        '<b>วิธีใช้งานบน iPhone / iPad</b><br>' +
        '1. กลับไปยังหน้าระบบลงทะเบียนใน LINE<br>' +
        '2. กดเมนูจุดสามจุด หรือเมนูเพิ่มเติมของ LINE<br>' +
        '3. เลือกเปิดด้วยเบราว์เซอร์ภายนอก หรือ Open in Browser<br>' +
        '4. เลือก Safari<br>' +
        '5. เข้าสู่ระบบใหม่และดำเนินการลงทะเบียนจนเสร็จใน Safari';
    } else {
      message =
        '<b>วิธีใช้งาน</b><br>' +
        'กรุณากลับไปยังหน้าระบบลงทะเบียน แล้วเลือกเปิดผ่านเบราว์เซอร์ภายนอก เช่น Chrome หรือ Safari จากนั้นเข้าสู่ระบบใหม่';
    }

    guide.innerHTML = message;

    document.getElementById('openBtn')
      .classList.add('hidden');

    document.getElementById('captureBtn')
      .classList.add('hidden');

    document.getElementById('retakeBtn')
      .classList.add('hidden');

    document.getElementById('confirmBtn')
      .classList.add('hidden');
  }

  // แจ้งหน้า Training ว่าหน้ากล้องพร้อมแล้ว
  function notifyReady() {

    // ไม่อนุญาตให้ใช้กล้องจาก LINE In-app Browser
    // ให้เปิดระบบลงทะเบียนทั้งระบบใน Chrome หรือ Safari
    if (isLineBrowser) {
      setStatus(
        'ตรวจพบว่ากำลังเปิดผ่าน LINE กรุณาเปิดระบบลงทะเบียนทั้งหมดผ่านเบราว์เซอร์ภายนอก',
        'error'
      );

      showBrowserGuide();
      return;
    }

    if (!window.isSecureContext) {
      setStatus(
        'การเชื่อมต่อไม่ปลอดภัย กรุณาเปิดผ่าน HTTPS',
        'error'
      );
      return;
    }

    if (!window.opener || !cameraNonce) {
      setStatus(
        'ไม่พบการเชื่อมต่อกับหน้าระบบลงทะเบียน กรุณาเปิดกล้องจากปุ่มในระบบลงทะเบียนอีกครั้ง',
        'error'
      );
      return;
    }

    cameraReady = true;

    window.opener.postMessage({
      type: 'TRAINING_CAMERA_READY',
      nonce: cameraNonce
    }, '*');

    setStatus(
      'เชื่อมต่อกับระบบลงทะเบียนแล้ว กรุณากดเปิดกล้อง',
      'success'
    );
  }

  async function startCamera() {

    if (!cameraReady) {
      setStatus(
        'ยังไม่ได้เชื่อมต่อกับหน้าระบบลงทะเบียน กรุณาเปิดกล้องจากระบบลงทะเบียนอีกครั้ง',
        'error'
      );
      return;
    }

    try {
      stopCamera();

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        throw new Error(
          'เบราว์เซอร์นี้ไม่รองรับการเปิดกล้อง กรุณาใช้ Chrome หรือ Safari'
        );
      }

      setStatus(
        'กำลังขออนุญาตใช้งานกล้อง กรุณารอสักครู่',
        ''
      );

      // ขอใช้กล้องหน้าเป็นอันดับแรก
      try {
        cameraStream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: 'user' },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            },
            audio: false
          });

      } catch (firstError) {

        // หากอุปกรณ์ไม่รองรับการกำหนดกล้องหน้า
        // ให้ลองเปิดกล้องด้วยการตั้งค่าทั่วไป
        if (
          firstError.name === 'OverconstrainedError' ||
          firstError.name === 'ConstraintNotSatisfiedError' ||
          firstError.name === 'NotFoundError'
        ) {
          cameraStream =
            await navigator.mediaDevices.getUserMedia({
              video: true,
              audio: false
            });
        } else {
          throw firstError;
        }
      }

      const video = document.getElementById('video');

      video.srcObject = cameraStream;
      await video.play();

      video.classList.remove('hidden');

      document.getElementById('canvas')
        .classList.add('hidden');

      document.getElementById('openBtn')
        .classList.add('hidden');

      document.getElementById('captureBtn')
        .classList.remove('hidden');

      document.getElementById('retakeBtn')
        .classList.add('hidden');

      document.getElementById('confirmBtn')
        .classList.add('hidden');

      document.getElementById('browserGuide')
        .classList.add('hidden');

      photoData = null;

      setStatus(
        'เปิดกล้องแล้ว กรุณาจัดภาพใบหน้าให้ชัดเจน',
        'success'
      );

    } catch (error) {

      stopCamera();

      let message =
        'เปิดกล้องไม่สำเร็จ: ' +
        error.name + ' - ' + error.message;

      if (
        error.name === 'NotAllowedError' ||
        error.name === 'PermissionDeniedError' ||
        error.name === 'SecurityError'
      ) {
        message =
          'ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณาอนุญาตสิทธิ์กล้องให้เบราว์เซอร์ในการตั้งค่าเว็บไซต์ แล้วลองใหม่อีกครั้ง';
      } else if (error.name === 'NotFoundError') {
        message =
          'ไม่พบกล้องในอุปกรณ์ กรุณาตรวจสอบกล้องและลองใหม่';
      } else if (error.name === 'NotReadableError') {
        message =
          'กล้องกำลังถูกใช้งานโดยแอปอื่น กรุณาปิดแอปที่ใช้กล้องแล้วลองใหม่';
      }

      setStatus(message, 'error');

      document.getElementById('openBtn')
        .classList.remove('hidden');

      console.error('Camera error:', error);
    }
  }

  function capturePhoto() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    if (!video.videoWidth || !video.videoHeight) {
      setStatus(
        'กล้องยังไม่พร้อม กรุณารอสักครู่',
        'error'
      );
      return;
    }

    let width = video.videoWidth;
    let height = video.videoHeight;

    // จำกัดขนาดภาพเพื่อให้ส่งกลับได้รวดเร็ว
    const maxWidth = 1280;

    if (width > maxWidth) {
      height = Math.round(height * maxWidth / width);
      width = maxWidth;
    }

    canvas.width = width;
    canvas.height = height;

    const context = canvas.getContext('2d');

    context.drawImage(video, 0, 0, width, height);

    photoData = canvas.toDataURL('image/jpeg', 0.80);

    video.classList.add('hidden');
    canvas.classList.remove('hidden');

    stopCamera();

    document.getElementById('captureBtn')
      .classList.add('hidden');

    document.getElementById('retakeBtn')
      .classList.remove('hidden');

    document.getElementById('confirmBtn')
      .classList.remove('hidden');

    setStatus(
      'ถ่ายภาพเรียบร้อยแล้ว กรุณาตรวจสอบภาพก่อนยืนยัน',
      'success'
    );
  }

  function retakePhoto() {
    photoData = null;

    document.getElementById('canvas')
      .classList.add('hidden');

    document.getElementById('retakeBtn')
      .classList.add('hidden');

    document.getElementById('confirmBtn')
      .classList.add('hidden');

    startCamera();
  }

  function confirmPhoto() {

    if (!photoData) {
      setStatus(
        'ไม่พบภาพ กรุณาถ่ายภาพใหม่',
        'error'
      );
      return;
    }

    if (!window.opener || window.opener.closed) {
      setStatus(
        'ไม่พบหน้าระบบลงทะเบียน กรุณาเปิดระบบลงทะเบียนใหม่',
        'error'
      );
      return;
    }

    if (!cameraNonce) {
      setStatus(
        'ไม่พบรหัสเชื่อมต่อ กรุณาเปิดกล้องใหม่',
        'error'
      );
      return;
    }

    const confirmBtn =
      document.getElementById('confirmBtn');

    confirmBtn.disabled = true;

    window.opener.postMessage({
      type: 'TRAINING_CAMERA_PHOTO',
      nonce: cameraNonce,
      data: photoData,
      mimeType: 'image/jpeg'
    }, '*');

    setStatus(
      'ส่งภาพกลับไปยังระบบลงทะเบียนแล้ว กรุณารอสักครู่',
      'success'
    );

    setTimeout(function() {
      window.close();
    }, 1000);
  }

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }

    const video = document.getElementById('video');

    if (video) {
      video.srcObject = null;
    }
  }

  function closeCameraPage() {
    stopCamera();
    window.close();
  }

  window.addEventListener('beforeunload', stopCamera);

  window.addEventListener('load', notifyReady);

</script>

</body>
</html>
